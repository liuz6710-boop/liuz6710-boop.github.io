<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Merchant behaviour analysis sized into a five-year revenue case">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101014"/><stop offset="100%" stop-color="#1b1b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.25"/><stop offset="100%" stop-color="#f5c842" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg2)"/>
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M120 620H1090M120 500H1090M120 380H1090M120 260H1090M120 140H1090"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="120" y="110" font-size="15" fill="#f5c842" letter-spacing="3">E-COMMERCE FULFILMENT · OPPORTUNITY SIZING</text>

    <!-- channel inputs -->
    <g font-size="17" fill="#9a958c">
      <text x="120" y="176">Merchant order behaviour</text>
      <text x="120" y="208" fill="#6f6b64" font-size="15">TikTok Shop · Shopee · Lazada</text>
    </g>

    <!-- cumulative bars -->
    <g>
      <rect x="180" y="520" width="90" height="100" rx="6" fill="url(#bar)"/>
      <rect x="330" y="470" width="90" height="150" rx="6" fill="url(#bar)"/>
      <rect x="480" y="410" width="90" height="210" rx="6" fill="url(#bar)"/>
      <rect x="630" y="340" width="90" height="280" rx="6" fill="url(#bar)"/>
      <rect x="780" y="255" width="90" height="365" rx="6" fill="url(#bar)"/>
    </g>
    <g font-size="15" fill="#6f6b64" text-anchor="middle">
      <text x="225" y="650">Y1</text><text x="375" y="650">Y2</text><text x="525" y="650">Y3</text>
      <text x="675" y="650">Y4</text><text x="825" y="650">Y5</text>
    </g>
    <path d="M120 620H1090" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- callout -->
    <g>
      <rect x="900" y="230" width="190" height="112" rx="12" fill="#f5c842"/>
      <text x="995" y="278" font-size="30" font-weight="700" fill="#0b0b0c" text-anchor="middle">S$1.5M+</text>
      <text x="995" y="308" font-size="14" fill="rgba(11,11,12,0.72)" text-anchor="middle">projected revenue</text>
      <text x="995" y="328" font-size="14" fill="rgba(11,11,12,0.72)" text-anchor="middle">over five years</text>
    </g>

    <text x="120" y="712" font-size="16" fill="#9a958c">analysis → business case → leadership review → prioritised against competing initiatives</text>
  </g>
</svg>
